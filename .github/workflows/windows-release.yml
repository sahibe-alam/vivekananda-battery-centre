name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}

      - name: Check Node & npm
        run: node -v && npm -v

      - name: Check electron & electron-builder versions
        run: |
          npx electron --version || true
          npx electron-builder --version || true

      - name: Install dependencies (capture)
        run: npm install 2>&1 | tee npm-install.log

      - name: Upload npm install log
        uses: actions/upload-artifact@v4
        with:
          name: npm-install-log
          path: npm-install.log

      - name: Rebuild native dependencies
        run: |
          npx electron-builder install-app-deps || true
          npx @electron/rebuild -f -w better-sqlite3 || true

      - name: Build renderer & main (capture)
        run: npm run build 2>&1 | tee build.log

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Create Windows installer (NSIS) (capture)
        run: npx electron-builder --win --x64 2>&1 | tee eb.log

      - name: Upload electron-builder log
        uses: actions/upload-artifact@v4
        with:
          name: electron-builder-log
          path: eb.log

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*
